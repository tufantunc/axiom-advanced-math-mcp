services:
  axiom-math-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: axiom-math
    environment:
      - NODE_ENV=production
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3000
      # No AXIOM_EVAL_TIMEOUT_MS override on purpose: the 10 s default bounds
      # how long one unauthenticated request can hold the single shared Giac
      # worker. Raise it only if you have a workload that genuinely needs it.
      # Required if you reach this container by its LAN IP, a hostname, or a
      # reverse-proxy domain rather than localhost/127.0.0.1 -- otherwise
      # POST /mcp gets a 403 (DNS-rebinding protection, see README.md).
      # - MCP_ALLOWED_HOSTS=mcp.example.com
    ports:
      - '3000:3000'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - axiom-network

networks:
  axiom-network:
    driver: bridge
