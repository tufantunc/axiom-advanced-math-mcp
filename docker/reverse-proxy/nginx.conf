# Reverse proxy in front of the Axiom MCP HTTP transport.
#
# The server itself has no authentication and no rate limiting, by design — it
# is stateless so it can scale horizontally, and an in-process rate-limit
# bucket would undo that. Both belong here.

# Rate limit and concurrency limit, keyed on client IP.
#
# The concurrency limit is the one that matters most: Giac is a single worker
# and tool calls are serialised, so a caller with many parallel requests can
# occupy the queue and starve everyone else. Per-evaluation timeouts do not
# help — each request is legitimately waiting its turn.
limit_req_zone $binary_remote_addr zone=mcp_rate:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=mcp_conn:10m;

limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;

    # Uptime checks should not need credentials, and /health exposes nothing
    # but readiness.
    location = /health {
        proxy_pass http://axiom:3000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /mcp {
        auth_basic "Axiom MCP";
        auth_basic_user_file /etc/nginx/htpasswd;

        # 60r/m sustained, with a burst so a normal client making a few calls
        # in quick succession is not punished. Raise for a busy team.
        limit_req zone=mcp_rate burst=20 nodelay;
        # Four in flight per client. Giac serialises anyway, so a higher number
        # only grows the queue.
        limit_conn mcp_conn 4;

        # The app caps an expression at 8 KB; this bounds the whole JSON-RPC
        # envelope well above that and rejects the rest before Node sees it.
        client_max_body_size 64k;

        proxy_pass http://axiom:3000/mcp;

        # Forward the public hostname. The app validates Host against
        # MCP_ALLOWED_HOSTS (DNS-rebinding protection), so that variable must
        # name this proxy's hostname or every request gets a 403.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer than the 10 s per-evaluation timeout, so a slow-but-legitimate
        # computation is not cut off by the proxy first.
        proxy_read_timeout 60s;
    }

    # Nothing else is part of the protocol surface.
    location / {
        return 404;
    }
}
