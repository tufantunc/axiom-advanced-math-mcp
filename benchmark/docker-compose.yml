services:
  benchmark:
    build:
      context: ..
      dockerfile: benchmark/Dockerfile
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MCP_SERVER_CMD=tsx /app/src/cli.ts
    volumes:
      - ./cache:/app/benchmark/cache
      - ./results:/app/benchmark/results
    profiles: [quick]
    command: ["npm", "run", "quick"]

  benchmark-full:
    build:
      context: ..
      dockerfile: benchmark/Dockerfile
